name: Ejecutar Pruebas

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pruebas:

    runs-on: ubuntu-latest


    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install playwright
          pip install allure-pytest

      - name: Instalar navegadores Playwright
        run: |
          python -m playwright install-deps
          python -m playwright install chromium

      - name: Ejecutar pruebas
        run: |
          python -m pytest pruebas -v
        continue-on-error: true

      - name: Instalar Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre    

      - name: Instalar Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.45.0/allure-2.45.0.tgz
          tar -zxvf allure-2.45.0.tgz

      - name: Generar reporte Allure
        if: always()
        run: |
          ./allure-2.45.0/bin/allure generate allure-results -o allure-report --clean

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
        
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4  
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
      
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4